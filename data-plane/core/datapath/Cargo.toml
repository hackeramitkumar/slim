[package]
name = "agntcy-slim-datapath"
version = "0.7.0"
edition = { workspace = true }
license = { workspace = true }
description = "Core data plane functionality for SLIM"

[lib]
name = "slim_datapath"

[features]
default = ["native"]
native = [
    "dep:agntcy-slim-config",
    "agntcy-slim-config/native",
    "dep:agntcy-slim-tracing",
    "agntcy-slim-tracing/native",
    "dep:display-error-chain",
    "dep:drain",
    "dep:fastwebsockets",
    "dep:h2",
    "dep:opentelemetry",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:tonic",
    "dep:tracing-opentelemetry",
]
wasm = ["dep:getrandom", "uuid/js"]

[dependencies]
agntcy-slim-config = { workspace = true, optional = true }
agntcy-slim-tracing = { workspace = true, optional = true }
bit-vec = { workspace = true }
bytes = { workspace = true }
display-error-chain = { workspace = true, optional = true }
drain = { workspace = true, optional = true }
fastwebsockets = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
parking_lot = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
uuid = { workspace = true }

[build-dependencies]
protoc-bin-vendored = { workspace = true }
tonic-build = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tracing-test = { workspace = true }

[[bench]]
name = "pool_benchmark"
harness = false
