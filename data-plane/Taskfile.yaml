---

version: '3'

silent: true
set: [pipefail]
shopt: [globstar]

includes:
  data-plane:
    taskfile: ../tasks/rust.yaml
    vars:
      GLOBAL_ARGS: "--workspace"

vars:
  CARGO_COMPONENTS: "cargo-sort cargo-audit cargo-llvm-cov cargo-machete@0.7.0 cargo-deny@0.17.0 typos-cli"

tasks:
  data-plane:python-bindings:lint:
    desc: "Python linter"
    internal: true
    dir: ./python-bindings
    cmds:
      - task python-bindings:lint

  data-plane:lint:
    desc: "Run the linter"
    cmds:
      - task: data-plane:lintall
      - task: data-plane:python-bindings:lint

  data-plane:build:strip:
    desc: "Build the project and strip the debug symbols"
    cmds:
      - task: data-plane:build
      - task: data-plane:toolchain:strip
        vars:
          TARGET_BIN: "target/{{.TARGET}}/{{.PROFILE}}/slim"

  data-plane:run:server:
    desc: "Run the server"
    cmds:
      - task: data-plane:build
      - task: data-plane:toolchain:run
        vars:
          ARGS: ""
          BIN: "slim"
          BIN_ARGS: "--config ./config/base/server-config.yaml"

  data-plane:run:server-with-otel:
    desc: "Run the server with OpenTelemetry enabled"
    cmds:
      - task: data-plane:build
      - task: data-plane:toolchain:run
        vars:
          ARGS: ""
          BIN: "slim"
          BIN_ARGS: "--config ./config/telemetry/server-config.yaml"

  data-plane:telemetry:start:
    desc: "Start telemetry stack"
    cmds:
      - docker compose -f ./config/telemetry/docker-compose.yml up

  data-plane:bindings:python:
    desc: "Generate the Python bindings"
    dir: ./python-bindings
    cmds:
      - task python-bindings:packaging PROFILE={{.PROFILE}} TARGET={{.TARGET}}
    vars:
      PROFILE: '{{.PROFILE | default "debug"}}'
      TARGET: '{{.TARGET | default ""}}'

  data-plane:bindings:test:
    desc: "Test the Python bindings"
    dir: ./python-bindings
    cmds:
      - task python-bindings:test TESTS={{.TESTS}}
    vars:
      TESTS: '{{.TESTS | default ""}}'

  data-plane:check:config-wasm:
    desc: "Check agntcy-slim-config compiles with wasm feature for wasm target"
    cmds:
      - cargo check --package agntcy-slim-config --no-default-features --features wasm --target wasm32-unknown-unknown --locked

  data-plane:check:wasm:
    desc: "Check all WASM-ready crates compile for wasm32-unknown-unknown"
    cmds:
      - task: data-plane:check:config-wasm
      - cargo check -p agntcy-slim-auth --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-datapath --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-tracing --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-signal --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-mls --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-session --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-controller --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-service --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - cargo check -p agntcy-slim-wasm --target wasm32-unknown-unknown --locked

  data-plane:slim:version:
    desc: "Get version from corresponding git tag"
    cmds:
      - git describe --tags --match "slim-v*" | cut -d 'v' -f 2
