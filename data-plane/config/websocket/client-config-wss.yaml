# WebSocket client config with TLS (wss://)

tracing:
  log_level: debug
  display_thread_names: true
  display_thread_ids: true

runtime:
  n_cores: 0
  thread_name: "slim-data-plane"
  drain_timeout: 10s

services:
  slim/0:
    pubsub:
      servers: []
      clients: []
      websocket_servers: []
      websocket_clients:
        - endpoint: "wss://localhost:46357"
          websocket_auth_query_param: token
          shared_secret: "my-shared-secret"
          identity: "org1/ns1/app1"
          tls:
            insecure: false
            ca_file: "testdata/ca.crt"
