# WebSocket server config (ws://, no TLS)

tracing:
  log_level: debug
  display_thread_names: true
  display_thread_ids: true

runtime:
  n_cores: 0
  thread_name: "slim-data-plane"
  drain_timeout: 10s

services:
  slim/0:
    pubsub:
      servers: []
      clients: []
      websocket_servers:
        - endpoint: "0.0.0.0:46357"
          websocket_auth_query_param: token
          tls:
            insecure: true
      websocket_clients: []
